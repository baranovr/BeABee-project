<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 500px;
            padding: 30px;
            text-align: center;
            border: 1px solid #e4e7eb;
        }
        .header {
            margin-bottom: 25px;
        }
        .header h2 {
            color: #2c3e50;
            font-size: 24px;
            margin: 0;
        }
        .code {
            background-color: #f1f5f9;
            border-radius: 10px;
            color: #2563eb;
            display: inline-block;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 5px;
            padding: 15px 25px;
            margin: 20px 0;
        }
        p {
            color: #4a5568;
            font-size: 15px;
        }
        .footer {
            border-top: 1px solid #edf2f7;
            color: #718096;
            font-size: 12px;
            margin-top: 25px;
            padding-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Your verification code</h2>
        </div>
        <p>Hello!</p>
        <p>Your verification code for login:</p>
        <div class="code">{{ code }}</div>
        <p>This code is valid for 5 minutes.</p>
        <p>If you have not set this code, just skip this email.</p>
        <div class="footer">
            <p>Sincerely, your BeABee team</p>
        </div>
    </div>
</body>
</html>
