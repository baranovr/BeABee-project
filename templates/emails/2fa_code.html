<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код подтверждения</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-image: url('https://images.rawpixel.com/image_400/czNmcy1wcml2YXRlL3Jtcy1kZW1vLzEyNTkxMzQuanBn.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: rgba(255, 255, 255, 0.9); /* Прозрачный белый фон */
            border: 2px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 28px;
            font-weight: bold;
            color: #4caf50;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        p {
            font-size: 16px;
            margin: 10px 0;
        }
        .code {
            display: inline-block;
            font-size: 28px;
            color: #ff4d4f;
            font-weight: bold;
            padding: 10px 20px;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: white;
            border-radius: 5px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #ddd;
            padding-top: 10px;
        }
        .footer p {
            margin: 5px 0;
        }
        .highlight {
            color: #4caf50;
            font-weight: bold;
        }
        a {
            text-decoration: none;
            color: #2196f3;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Ваш код подтверждения</h2>
        </div>
        <p>Здравствуйте!</p>
        <p>Ваш код подтверждения для входа:</p>
        <p class="code">{{ code }}</p>
        <p>Этот код действителен в течение <span class="highlight">5 минут</span>.</p>
        <p>Если вы не запрашивали этот код, просто игнорируйте это письмо.</p>
        <div class="footer">
            <p>С уважением, команда вашего проекта.</p>
            <p><a href="https://yourwebsite.com">Посетите наш сайт</a></p>
        </div>
    </div>
</body>
</html>
