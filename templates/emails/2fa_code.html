<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код подтверждения</title>
    <style>
        body {
            font-family: 'Roboto', Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f3f4f6, #e9ecef);
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: 1px solid #ddd;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            font-size: 28px;
            color: #333;
        }
        .code {
            font-size: 32px;
            color: #ff5722;
            font-weight: bold;
            text-align: center;
            display: block;
            margin: 20px 0;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #aaa;
            border-top: 1px solid #eee;
            padding-top: 10px;
        }
        a {
            color: #ff5722;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Your verification code</h2>
        </div>
        <p>Hello!</p>
        <p>Your verification code for login:</p>
        <span class="code">{{ code }}</span>
        <p>This code is valid for 5 minutes.</p>
        <p>If you have not set this code, just skip this email.</p>
        <div class="footer">
            <p>Sincerely, your BeABee team</a>.</p>
        </div>
    </div>
</body>
</html>
